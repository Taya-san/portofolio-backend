definitions:
  entity.GithubProject:
    properties:
      body:
        type: string
      createdAt:
        type: string
      description:
        type: string
      id:
        type: string
      languages:
        items:
          type: string
        type: array
      project_url:
        type: string
      title:
        type: string
    type: object
  entity.Project:
    properties:
      body:
        type: string
      createdAt:
        type: string
      custom:
        type: boolean
      description:
        type: string
      id:
        type: string
      languages:
        items:
          type: string
        type: array
      project_url:
        type: string
      title:
        type: string
      visible:
        type: boolean
    type: object
  response.ProjectList:
    properties:
      projects:
        items:
          $ref: '#/definitions/entity.Project'
        type: array
      total:
        type: integer
    type: object
  response.Token:
    properties:
      token:
        type: string
    type: object
  v1.CreateProject:
    properties:
      body:
        type: string
      createdAt:
        type: string
      description:
        type: string
      languages:
        items:
          type: string
        type: array
      project_url:
        type: string
      title:
        type: string
      visible:
        type: boolean
    required:
    - body
    - createdAt
    - description
    - languages
    - project_url
    - title
    - visible
    type: object
  v1.Error:
    properties:
      error:
        example: message
        type: string
    type: object
  v1.Login:
    properties:
      password:
        type: string
    required:
    - password
    type: object
  v1.UpdateProject:
    properties:
      body:
        type: string
      createdAt:
        type: string
      description:
        type: string
      languages:
        items:
          type: string
        type: array
      project_url:
        type: string
      title:
        type: string
      visible:
        type: boolean
    type: object
info:
  contact: {}
paths:
  /auth/login:
    post:
      consumes:
      - application/json
      description: Authenticate user and get JWT token
      operationId: login
      parameters:
      - description: Login credentials
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/v1.Login'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Token'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/v1.Error'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/v1.Error'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/v1.Error'
      summary: Login
      tags:
      - auth
  /edit:
    post:
      consumes:
      - application/json
      description: Create a new project
      operationId: create-project
      parameters:
      - description: Project data
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/v1.CreateProject'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/entity.Project'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/v1.Error'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/v1.Error'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/v1.Error'
      security:
      - BearerAuth: []
      summary: Create project
      tags:
      - projects
  /edit/{id}:
    delete:
      description: Delete a project by ID
      operationId: delete-project
      parameters:
      - description: Project ID
        in: path
        name: id
        required: true
        type: string
      responses:
        "204":
          description: No Content
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/v1.Error'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/v1.Error'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/v1.Error'
      security:
      - BearerAuth: []
      summary: Delete project
      tags:
      - projects
    put:
      consumes:
      - application/json
      description: Update project data
      operationId: update-project
      parameters:
      - description: Project ID
        in: path
        name: id
        required: true
        type: string
      - description: Updated project data
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/v1.UpdateProject'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/entity.Project'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/v1.Error'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/v1.Error'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/v1.Error'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/v1.Error'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/v1.Error'
      security:
      - BearerAuth: []
      summary: Update project
      tags:
      - projects
  /edit/githubproject:
    get:
      consumes:
      - application/json
      description: Get data from github_projects
      operationId: get-githubProject
      parameters:
      - description: Project Url
        in: query
        name: request
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/entity.GithubProject'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/v1.Error'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/v1.Error'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/v1.Error'
      security:
      - BearerAuth: []
      summary: Get githubProject
      tags:
      - githubProjects
  /project/{id}:
    get:
      description: Get a project by ID
      operationId: get-project
      parameters:
      - description: Project ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/entity.Project'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/v1.Error'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/v1.Error'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/v1.Error'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/v1.Error'
      security:
      - BearerAuth: []
      summary: Get project
      tags:
      - projects
  /projects:
    get:
      description: List projects with filtering
      operationId: list-projects
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.ProjectList'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/v1.Error'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/v1.Error'
      security:
      - BearerAuth: []
      summary: List projects
      tags:
      - projects
swagger: "2.0"
